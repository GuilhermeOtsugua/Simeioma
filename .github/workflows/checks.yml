name: Regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native_smoke:
        description: Run isolated native checks on the trusted interactive desktop runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo check --locked --release --manifest-path src-tauri/Cargo.toml
  native:
    if: github.event_name == 'workflow_dispatch' && inputs.native_smoke && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, simeioma-desktop]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:diagnostics:native
